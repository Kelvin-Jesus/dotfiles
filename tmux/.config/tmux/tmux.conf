unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

unbind %
unbind '"'
unbind |
unbind -

# Split horizontal: abre na pasta do pane atual
bind | split-window -h -c "#{pane_current_path}"

# Split vertical: abre na pasta do pane atual
bind - split-window -v -c "#{pane_current_path}"

# Nova janela: sempre abre em ~
bind c new-window -c "#{HOME}"

# Keep window numbers clean after closing windows
set -g renumber-windows on

unbind r
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on

# Shift Alt vim Keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1

# Color Correction for background-theme
# set 256 color
set -g default-terminal "tmux-256color"
# tell Tmux that outside terminal supports true color
set -ga terminal-overrides ",xterm-256color*:Tc"

# New window starts in ~
bind c new-window -c ~

# # Panes inherit the current pane directory
# bind '"' split-window -v -c "#{pane_current_path}"
# bind % split-window -h -c "#{pane_current_path}"

# set default terminal to catppuccin
# set -g @catppuccin_flavour 'mocha'

# set -g default_terminal_icon=""
set -g default_active_terminal_icon=""

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible' # for sane tmux defaults
# set -g @plugin 'catppuccin/tmux'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'jimeh/tmux-themepack' # to configure tmux theme
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
# set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
#
set -g @plugin "janoamaral/tokyo-night-tmux"
set -g @tokyo-night-tmux_window_id_style none
set -g @tokyo-night-tmux_pane_id_style hide 
set -g @tokyo-night-tmux_zoom_id_style dsquare
set -g @tokyo-night-tmux_show_datetime 0

# set -g @themepack 'powerline/default/catppuccin-tmux' # use this theme for tmux

set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'on'

set -g status-bg default
set -g status-style bg=default

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
